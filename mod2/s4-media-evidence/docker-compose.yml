services:
  s4-media-evidence:
    build:
      context: .
      dockerfile: Dockerfile
    image: ods/s4-media-evidence:0.1.0
    container_name: s4-media-evidence
    ports:
      - "8080:8080"
    volumes:
      - s4_media:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  s4_media: